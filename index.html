<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр по химии</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --border:#2a2f3a;
  --text:#e9ecf1; --muted:#9aa3b2; --accent:#6c8dff; --accent2:#8fb3ff;
  --good:#2ecc71; --bad:#ff5d5d; --warn:#ffb84d;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#0f1115,#12151c 40%,#0f1115);
  color:var(--text); min-height:100vh; padding-bottom:60px;
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px;}
h1{font-size:1.4rem;margin:6px 0 4px;text-align:center;background:linear-gradient(90deg,#8fb3ff,#c39bff);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:18px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);}
.topbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:14px;}
.stats{display:flex;gap:10px;flex-wrap:wrap;}
.pill{background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--muted);}
.pill b{color:var(--text);}
.pill.good{color:var(--good);border-color:rgba(46,204,113,.35);}
.pill.bad{color:var(--bad);border-color:rgba(255,93,93,.35);}
.progress-wrap{background:var(--card2);border-radius:999px;height:8px;overflow:hidden;margin:10px 0 18px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),#c39bff);width:0%;transition:width .3s;}
select,button{
  font-family:inherit;font-size:.9rem;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);padding:8px 12px;cursor:pointer;
}
select:hover,button:hover{border-color:var(--accent);}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;margin-bottom:8px;}
.qtext{font-size:1.08rem;line-height:1.5;margin:6px 0 16px;font-weight:600;}
.qimg{width:100%;border-radius:10px;border:1px solid var(--border);background:#fff;margin:0 0 16px;}
.qimg.single-img{margin-bottom:6px;}
.opt{
  display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.15s;
}
.opt:hover{border-color:var(--accent);}
.opt.selected{border-color:var(--accent);background:rgba(108,141,255,.12);}
.opt.correct{border-color:var(--good);background:rgba(46,204,113,.14);}
.opt.incorrect{border-color:var(--bad);background:rgba(255,93,93,.14);}
.opt .box{
  flex:0 0 auto;width:20px;height:20px;border:2px solid var(--muted);margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--bg);font-weight:700;
}
.opt.selected .box{background:var(--accent);border-color:var(--accent);color:#fff;}
.opt.correct .box{background:var(--good);border-color:var(--good);color:#0b1b12;}
.opt.incorrect .box{background:var(--bad);border-color:var(--bad);color:#2a0a0a;}
.opt.radio .box{border-radius:50%;}
.opt .otext{flex:1;line-height:1.4;}
.typebadge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:rgba(108,141,255,.15);color:var(--accent2);border:1px solid rgba(108,141,255,.3);}
.result{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.92rem;display:none;}
.result.show{display:block;}
.result.ok{background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.35);color:#a4f0c4;}
.result.no{background:rgba(255,93,93,.12);border:1px solid rgba(255,93,93,.35);color:#ffc2c2;}
.result.info{background:rgba(108,141,255,.12);border:1px solid rgba(108,141,255,.35);color:#c9d6ff;}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap;}
.btn-main{background:linear-gradient(90deg,var(--accent),#8a6cff);color:#fff;border:none;font-weight:600;padding:10px 20px;}
.btn-main:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:transparent;}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:16px;}
.grid-nav button{padding:0;height:34px;font-size:.75rem;position:relative;}
.grid-nav button.answered-ok{background:rgba(46,204,113,.18);border-color:rgba(46,204,113,.5);color:#a4f0c4;}
.grid-nav button.answered-bad{background:rgba(255,93,93,.18);border-color:rgba(255,93,93,.5);color:#ffc2c2;}
.grid-nav button.current{outline:2px solid var(--accent);}
.section-title{margin:20px 0 8px;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;}
.finish-screen{text-align:center;padding:30px 10px;}
.finish-score{font-size:2.6rem;font-weight:700;background:linear-gradient(90deg,#8fb3ff,#c39bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.bad-list{text-align:left;margin-top:16px;max-height:260px;overflow-y:auto;font-size:.85rem;color:var(--muted);}
.bad-list div{padding:6px 0;border-bottom:1px solid var(--border);}
.topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.topic-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;font-size:.95rem;color:var(--text);}
.topic-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.topic-card .tn{font-size:.75rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block;}
.topic-card .tt{font-weight:600;line-height:1.3;}
.topic-card .tc{margin-top:8px;color:var(--muted);font-size:.8rem;display:block;}
.sec-title{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;}
.home-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.optgrid{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;}
.numopt{min-width:44px;height:44px;border-radius:12px;font-weight:700;font-size:1rem;padding:0 10px;}
.numopt.selected{border-color:var(--accent);background:rgba(108,141,255,.18);}
.numopt.correct{border-color:var(--good);background:rgba(46,204,113,.18);}
.numopt.incorrect{border-color:var(--bad);background:rgba(255,93,93,.18);}
.match-slot{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.match-slot .msi{flex:0 0 22px;font-weight:700;color:var(--accent2);}
.match-slot .msv{flex:1;color:var(--muted);}
.match-slot .msb{flex:0 0 38px;height:34px;border-radius:8px;font-weight:700;}
.match-slot.filled .msb{border-color:var(--accent);color:#fff;}
.match-slot.ok .msb{border-color:var(--good);color:var(--good);}
.match-slot.no .msb{border-color:var(--bad);color:var(--bad);}
.match-count{font-size:.8rem;color:var(--muted);margin:4px 0 10px;}
@media (max-width:480px){ .qtext{font-size:1rem;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Тренажёр по химии</h1>
  <div class="sub" id="subline">Тестовые задания по курсу химии</div>

  <!-- HOME: topic picker -->
  <div id="homeArea">
    <div class="card">
      <div class="home-head">
        <div class="sec-title">Выберите тему</div>
      </div>
      <div class="topicgrid" id="topicGrid"></div>
    </div>
    <div style="text-align:center;color:var(--muted);font-size:.78rem;margin-top:24px;">
      Вопросы извлекаются из PDF учебного теста. Вопросы с формулами и структурами показаны картинками, вырезки из оригинала.
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizWrap" style="display:none;">
    <button class="btn-ghost" id="backBtn" style="margin-bottom:12px;font-size:.85rem;">← Все темы</button>
    <div class="card">
      <div class="topbar">
        <div class="stats">
          <span class="pill">Вопрос <b id="qnum">1</b> / <span id="qtotal">0</span></span>
          <span class="pill good">✓ <b id="statOk">0</b></span>
          <span class="pill bad">✗ <b id="statBad">0</b></span>
          <span class="pill">Отвечено: <b id="statAnswered">0</b></span>
        </div>
        <div class="controls">
          <select id="modeSelect">
            <option value="order">По порядку</option>
            <option value="random">Случайный порядок</option>
            <option value="wrong" id="optWrong">Только ошибки (0)</option>
            <option value="text">Только текстовые</option>
            <option value="img">Только с картинками</option>
          </select>
          <button id="resetBtn" class="btn-ghost">Сбросить</button>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

      <div id="quizArea">
        <div class="qmeta">
          <span>Тема: <b id="qTopicName"></b> · №<span id="qid"></span></span>
          <span class="typebadge" id="typeBadge"></span>
        </div>
        <div class="qtext" id="qtext"></div>
        <div id="qimgWrap"></div>
        <div id="optsWrap"></div>
        <div id="matchWrap"></div>
        <div class="match-count" id="matchCount"></div>

        <div class="actions" style="margin-top:6px;">
          <button class="hintbtn btn-ghost" id="revealBtn">👁 Показать ответ</button>
        </div>
        <div class="result" id="resultBox"></div>

        <div class="actions">
          <button id="prevBtn" class="btn-ghost">← Назад</button>
          <button id="checkBtn" class="btn-main">Проверить</button>
          <button id="nextBtn" class="btn-ghost">Дальше →</button>
        </div>
      </div>

      <div id="finishArea" style="display:none;" class="finish-screen">
        <div class="finish-score" id="finalScore">0%</div>
        <div style="color:var(--muted);margin-top:6px;">правильных ответов</div>
        <div style="margin-top:18px;">
          <button class="btn-main" id="restartBtn">Пройти заново</button>
          <button class="btn-ghost" id="reviewWrongBtn">Повторить ошибки</button>
        </div>
        <div class="bad-list" id="badList"></div>
      </div>

      <div class="section-title">Карта вопросов</div>
      <div class="grid-nav" id="gridNav"></div>
    </div>
  </div>
</div>

ора в 1 мл раствора", "3": "масса растворенного вещества в 1 мл раствора", "4": "количество растворенного вещества в 1 кг растворителя"}, "nopts": 4, "stem": "6. Титр раствора"}, {"id": 7, "type": "single", "correct": "3", "nopts": 4, "imgs": ["t01_q007.png"]}, {"id": 8, "type": "single", "correct": "2", "nopts": 4, "imgs": ["t01_q008.png"]}, {"id": 9, "type": "single", "correct": "4", "nopts": 4, "imgs": ["t01_q009.png"]}, {"id": 10, "type": "fill", "correct": "(X)", "nopts": 0, "imgs": ["t01_q010.png"]}, {"id": 11, "type": "fill", "correct": "C(X)", "nopts": 0, "imgs": ["t01_q011.png"]}, {"id": 12, "type": "fill", "correct": "b(X", "nopts": 0, "imgs": ["t01_q012.png"]}, {"id": 13, "type": "single", "correct": "1", "opts": {"1": "моль/л", "2": "г/л", "3": "моль/кг", "4": "г/мл"}, "nopts": 4, "stem": "13. Единица измерения молярной концентрации"}, {"id": 14, "type": "single", "correct": "1", "opts": {"1": "моль/л", "2": "моль/кг", "3": "г/моль", "4": "г/мл"}, "nopts": 4, "stem": "14. Единица измерения молярной концентрации эквивалента"}, {"id": 15, "type": "single", "correct": "1", "opts": {"1": "моль/кг", "2": "моль/л", "3": "г/моль", "4": "г/л"}, "nopts": 4, "stem": "15. Единица измерения моляльной концентрации"}, {"id": 16, "type": "single", "correct": "1", "opts": {"1": "г/мл", "2": "г/моль", "3": "г/л", "4": "моль/г"}, "nopts": 4, "stem": "16. Единица измерения титра"}, {"id": 17, "type": "single", "correct": "3", "opts": {"1": "постоянного состава, состоящая из двух и более независимых компонентов;", "2": "переменного состава, состоящая из двух и более независимых компонентов;", "3": "переменного состава, состоящая из двух и более независимых компонентов и продуктов их взаимодействия;", "4": "постоянного состава, состоящая из двух и более независимых компонентов и продуктов их взаимодействия;"}, "nopts": 4, "stem": "17. Раствор - это гомогенная система ..."}, {"id": 18, "type": "single", "correct": "3", "opts": {"1": "б, в", "2": "а, г", "3": "а, в", "4": "а, <script>
const TOPICS = (typeof TOPIC_DATA !== 'undefined') ? TOPIC_DATA : [];
const LETTERS=[];
const IMG='img/';
function imgPath(n){ return IMG+n; }

let curTopic=null;       // topic object
let activeList=[];       // indices into curTopic.questions in play order
let pos=0;
let selected={};   // 'qid' -> single: number(str); match: array; fill: null
let checked={};    // qid -> true/false
let results={};    // qid -> true/false (for single/match)
let filled={};     // qid -> revealed answer for fill

const TYPE_LABEL={single:'Один ответ', match:'Соответствие', fill:'Вставить формулу'};
const STORE='chem_trainer_v1';

const $=id=>document.getElementById(id);
const qtextEl=$('qtext'), optsWrap=$('optsWrap'), matchWrap=$('matchWrap'), matchCount=$('matchCount');
const qidEl=$('qid'), qnumEl=$('qnum'), qtotalEl=$('qtotal'), typeBadge=$('typeBadge');
const resultBox=$('resultBox'), checkBtn=$('checkBtn'), nextBtn=$('nextBtn'), prevBtn=$('prevBtn');
const progressBar=$('progressBar'), gridNav=$('gridNav');
const statOk=$('statOk'), statBad=$('statBad'), statAnswered=$('statAnswered');
const modeSelect=$('modeSelect'), quizArea=$('quizArea'), finishArea=$('finishArea');
const qimgWrap=$('qimgWrap'), qTopicName=$('qTopicName'), revealBtn=$('revealBtn');

// ---------- data access ----------
function key(){ return curTopic? STORE+'_t'+curTopic.num : STORE+'_t'; }
function currentQuestions(){ return curTopic? curTopic.questions : []; }
function byKey(q){ return 'q'+q.id; }

// ---------- persistence ----------
function loadProgress(){
  try{
    const raw=localStorage.getItem(key());
    if(raw){ const d=JSON.parse(raw); selected=d.selected||{}; checked=d.checked||{}; results=d.results||{}; filled=d.filled||{}; }
  }catch(e){}
}
function saveProgress(){
  try{ localStorage.setItem(key(), JSON.stringify({selected,checked,results,filled})); }catch(e){}
}

// ---------- home ----------
function buildHome(){
  const g=$('topicGrid'); g.innerHTML='';
  TOPICS.forEach(t=>{
    const b=document.createElement('div');
    b.className='topic-card';
    let done=0;
    try{ const d=JSON.parse(localStorage.getItem(STORE+'_t'+t.num)||'{}'); done=Object.keys(d.checked||{}).length; }catch(e){}
    b.innerHTML='<span class="tn">Тема '+t.num+'</span><span class="tt">'+t.title+'</span>'+
      '<span class="tc">'+t.questions.length+' вопросов'+(done? ' · отвечено '+done:'')+'</span>';
    b.onclick=()=>openTopic(t);
    g.appendChild(b);
  });
  $('subline').textContent = 'Тестовые задания по курсу химии · '+TOPICS.reduce((s,t)=>s+t.questions.length,0)+' вопросов';
}
function openTopic(t){
  curTopic=t; pos=0;
  activeList=currentQuestions().map((_,i)=>i);
  selected={};checked={};results={};filled={};
  loadProgress();
  $('homeArea').style.display='none'; $('quizWrap').style.display='block';
  qtotalEl.textContent=currentQuestions().length;
  $('subline').textContent=t.title;
  $('backBtn').textContent='← Тема '+t.num+'. '+t.title;
  buildGrid(); applyMode();
}
$('backBtn').onclick=()=>{ $('quizWrap').style.display='none'; $('homeArea').style.display='block'; buildHome(); };

// ---------- grid ----------
function buildGrid(){
  gridNav.innerHTML='';
  currentQuestions().forEach((q,i)=>{
    const b=document.createElement('button');
    b.textContent=(i+1);
    b.title='Вопрос №'+q.id;
    const ck=checked[byKey(q)];
    if(ck){ b.classList.add(results[byKey(q)]?'answered-ok':'answered-bad'); }
    b.onclick=()=>{
      const idx=activeList.indexOf(i);
      if(idx>=0){ pos=idx; } else { activeList=currentQuestions().map((_,j)=>j); pos=i; }
      render();
    };
    gridNav.appendChild(b);
  });
  highlightCurrent();
}
function highlightCurrent(){
  const idx=activeList[pos];
  Array.from(gridNav.children).forEach((b,i)=>{ b.classList.toggle('current', i===idx); });
}

// ---------- stats ----------
function updateStats(){
  const answered=Object.keys(checked).filter(k=>checked[k]);
  let ok=0,bad=0;
  answered.forEach(k=>{ if(results[k]) ok++; else bad++; });
  statOk.textContent=ok; statBad.textContent=bad; statAnswered.textContent=answered.length;
  progressBar.style.width=Math.round(100*answered.length/currentQuestions().length)+'%';
  const optWrong=$('optWrong'); if(optWrong) optWrong.textContent='Только ошибки ('+bad+')';
}

// ---------- check correctness ----------
function numLet(n){ return String.fromCharCode(0x430 + (Number(n)-1)); } // 1->а, 2->б, 3->в ...
function bigLet(i){ return String.fromCharCode(0x410 + i); } // 0->А,1->Б ...
function isCorrect(q){
  const k=byKey(q); const sel=selected[k];
  if(q.type==='single'){ return String(sel)==String(q.correct); }
  if(q.type==='match'){
    const a=(sel||[]).join('');
    return a===String(q.correct);
  }
  return false;
}

// ---------- render ----------
function render(){
  quizArea.style.display='block'; finishArea.style.display='none';
  if(pos<0)pos=0;
  if(pos>=activeList.length){ showFinish(); return; }
  const qi=activeList[pos]; const q=currentQuestions()[qi];
  qidEl.textContent=q.id; qnumEl.textContent=pos+1; qTopicName.textContent=curTopic.num;
  typeBadge.textContent=TYPE_LABEL[q.type]||'';
  const k=byKey(q);
  const isChecked=!!checked[k];
  resultBox.classList.remove('show','ok','no','info'); resultBox.textContent='';
  qimgWrap.innerHTML=''; optsWrap.innerHTML=''; matchWrap.innerHTML=''; matchCount.textContent='';
  revealBtn.style.display='block';
  revealBtn.textContent = q.type==='fill' ? '👁 Показать ответ' : '👁 Показать ответ';

  // stem text
  if(q.stem){ qtextEl.textContent=q.stem; qtextEl.style.display='block'; }
  else qtextEl.style.display='none';

  // images (question stem/structure)
  if(q.imgs && q.imgs.length){
    q.imgs.forEach(src=>{
      const im=document.createElement('img');
      im.className='qimg'+(q.type==='single'&& !q.opts ? ' single-img':'');
      im.src=imgPath(src); im.loading='lazy';
      qimgWrap.appendChild(im);
    });
  }

  if(q.type==='single'){
    if(q.opts){
      // text options
      Object.values(q.opts).forEach((text,ix)=>{
        const num=Object.keys(q.opts)[ix];
        const div=document.createElement('div');
        div.className='opt radio';
        const selIdx=(selected[k]===num);
        if(selIdx) div.classList.add('selected');
        if(isChecked){
          if(String(num)===String(q.correct)) div.classList.add('correct');
          else if(selIdx) div.classList.add('incorrect');
        }
        div.innerHTML='<div class="box">'+(selIdx?'✓':'')+'</div><div class="otext"><b>'+num+')</b> '+text+'</div>';
        div.onclick=()=>{
          if(checked[k]) return;
          selected[k]=num; saveProgress(); render();
        };
        optsWrap.appendChild(div);
      });
    } else {
      // image-based: number buttons
      const palette=document.createElement('div'); palette.className='optgrid';
      for(let n=1;n<=Math.max(q.nopts||0,1);n++){
        const b=document.createElement('button');
        b.className='numopt';
        b.textContent=n;
        if(String(selected[k])===String(n)) b.classList.add('selected');
        if(isChecked){
          if(String(n)===String(q.correct)) b.classList.add('correct');
          else if(String(selected[k])===String(n)) b.classList.add('incorrect');
        }
        b.onclick=()=>{ if(checked[k])return; selected[k]=String(n); saveProgress(); render(); };
        palette.appendChild(b);
      }
      optsWrap.appendChild(palette);
    }
  }
  else if(q.type==='match'){
    const items=q.items||0;
    matchCount.textContent='Назначьте № варианта (цифру) каждому пункту (слева-направо в таблице выше): '+items+' пунктов.';
    const assign=selected[k]||[];
    for(let i=0;i<items;i++){
      const row=document.createElement('div');
      row.className='match-slot'+(assign[i]!==undefined?' filled':'');
      const cur=assign[i]!==undefined?assign[i]:'';
      if(isChecked){
        const exp=String(q.correct)[i];
        row.classList.add(cur===exp?'ok':'no');
      }
      row.innerHTML='<div class="msi">'+bigLet(i)+')</div><div class="msv">'+(cur||'—')+'</div>'+
        '<button class="msb">'+(cur||'')+'</button>';
      row.querySelector('.msb').onclick=()=>{
        if(checked[k])return;
        const a=(selected[k]||[]).slice();
        a.splice(i,1); selected[k]=a; saveProgress(); render();
      };
      matchWrap.appendChild(row);
    }
    // palette
    const maxN=Math.max.apply(null, String(q.correct).split('').map(Number))||4;
    const palette=document.createElement('div'); palette.className='optgrid';
    for(let n=1;n<=maxN;n++){
      const b=document.createElement('button'); b.className='numopt'; b.textContent=n;
      b.onclick=()=>{
        if(checked[k])return;
        const a=(selected[k]||[]).slice();
        if(a.length>=items) return;
        a.push(String(n)); selected[k]=a; saveProgress(); render();
      };
      palette.appendChild(b);
    }
    optsWrap.appendChild(palette);
  }
  else if(q.type==='fill'){
    // show question image; reveal answer
  }

  if(isChecked){
    checkBtn.disabled=true;
    if(q.type==='fill'){
      resultBox.classList.add('show','info');
      resultBox.textContent='Ответ: '+q.correct;
    } else {
      const ok=results[k];
      resultBox.classList.add('show', ok?'ok':'no');
      resultBox.textContent=(ok?'✅ Верно! ':'❌ Неверно. ')+'Правильный ответ: '+fmtCorrect(q);
    }
  } else {
    checkBtn.disabled=false;
    if(q.type==='fill') checkBtn.disabled=true; // fill answered via reveal only
  }
  prevBtn.disabled=(pos===0);
  nextBtn.disabled=false;
  updateStats(); highlightCurrent();
}
function fmtCorrect(q){
  if(q.type==='single'){ return (q.opts? q.opts[q.correct] : '№'+q.correct); }
  if(q.type==='match'){ const d=String(q.correct); return [].map.call(d,(ch,i)=>bigLet(i)+'→'+ch).join(', '); }
  return q.correct;
}

// ---------- actions ----------
function checkAnswer(){
  const qi=activeList[pos]; const q=currentQuestions()[qi]; const k=byKey(q);
  if(checked[k]) return;
  if(q.type==='fill') return; // not used
  const ok=isCorrect(q);
  checked[k]=true; results[k]=ok; saveProgress(); buildGrid(); render();
}
revealBtn.onclick=()=>{
  const qi=activeList[pos]; const q=currentQuestions()[qi]; const k=byKey(q);
  if(q.type==='fill'){
    // fill question: reveal counts as answered
    checked[k]=true; results[k]=true; filled[k]=true; saveProgress(); buildGrid(); render();
    return;
  }
  if(checked[k]) return; // already answered via Проверить
  resultBox.classList.add('show','info');
  resultBox.textContent='Правильный ответ: '+fmtCorrect(q);
};
checkBtn.onclick=checkAnswer;
nextBtn.onclick=()=>{ pos++; render(); };
prevBtn.onclick=()=>{ pos--; render(); };
$('resetBtn').onclick=()=>{
  if(confirm('Сбросить прогресс по этой теме?')){
    selected={};checked={};results={};filled={}; saveProgress(); buildGrid(); applyMode();
  }
};
$('restartBtn').onclick=()=>{ modeSelect.value='order'; applyMode(); };
$('reviewWrongBtn').onclick=()=>{ modeSelect.value='wrong'; applyMode(); };

function showFinish(){
  quizArea.style.display='none'; finishArea.style.display='block';
  const answered=Object.keys(checked).filter(k=>checked[k]);
  const ok=answered.filter(k=>results[k]).length;
  const pct=answered.length?Math.round(100*ok/answered.length):0;
  $('finalScore').textContent=pct+'%';
  const bl=$('badList'); bl.innerHTML='';
  const wrong=answered.filter(k=>!results[k]);
  if(wrong.length){
    const title=document.createElement('div'); title.style.fontWeight='600'; title.style.color='var(--text)';
    title.textContent='Вопросы с ошибками ('+wrong.length+'):';
    bl.appendChild(title);
    wrong.forEach(k=>{ const q=currentQuestions().find(x=>byKey(x)===k); const d=document.createElement('div'); d.textContent='№'+q.id+' — '+(q.stem||('Вопрос '+q.correct?'№'+q.correct:'')); bl.appendChild(d); });
  } else if(answered.length){ bl.innerHTML='<div>Ошибок нет — отлично! 🎉</div>'; }
}

function applyMode(){
  const mode=modeSelect.value;
  const qs=currentQuestions();
  if(mode==='order') activeList=qs.map((_,i)=>i);
  else if(mode==='random'){
    activeList=qs.map((_,i)=>i);
    for(let i=activeList.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [activeList[i],activeList[j]]=[activeList[j],activeList[i]]; }
  } else if(mode==='wrong'){
    activeList=qs.map((_,i)=>i).filter(i=>{ const k=byKey(qs[i]); return checked[k]&&!results[k]; });
  } else if(mode==='text'){
    activeList=qs.map((_,i)=>i).filter(i=>qs[i].type==='single'&&qs[i].opts);
  } else if(mode==='img'){
    activeList=qs.map((_,i)=>i).filter(i=>qs[i].imgs&&qs[i].imgs.length);
  }
  pos=0; render();
}
modeSelect.onchange=applyMode;

buildHome();
</script>
</body>
</html>
